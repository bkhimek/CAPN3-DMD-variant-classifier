# Per-gene PM2/BA1/BS1 frequency thresholds.
#
# PM2 ("absent from controls, or at extremely low frequency if recessive"),
# BA1 ("too common for any plausible rare Mendelian disease"), and BS1
# ("more common than expected for this disorder") have no single universal
# cutoff — the appropriate threshold depends on the disease's prevalence,
# penetrance, and allelic/genetic heterogeneity (see Whiffin et al. 2017 for
# the general "maximum credible population AF" approach ClinGen VCEPs build
# on). Historically (Milestone 2/3) this project set one illustrative
# threshold per gene by hand. As of the batch-4 curated-set expansion, CAPN3
# uses the REAL published ClinGen LGMD VCEP thresholds instead of a
# placeholder — see threshold_source below. DMD still has no VCEP spec
# adopted here, so it falls back to the global default(s).
#
# threshold_source records where each number came from, so it's always
# clear which genes have a real VCEP-sourced threshold and which don't.

ba1_stand_alone_af: 0.05   # 5%, the generic ACMG/AMP default — used for any gene without a per-gene ba1_af override below

genes:
  DMD:
    pm2_max_credible_af: 0.0001   # 0.01% — placeholder, NOT a published VCEP number (see threshold_source)
    bs1_min_af: 0.001             # 0.1% — placeholder, NOT a published VCEP number (see threshold_source)
    threshold_source: >
      No ClinGen Variant Curation Expert Panel (VCEP) currently publishes
      gene/disease-specific ACMG/AMP criteria specifications for DMD or
      dystrophinopathy (checked against the ClinGen Criteria Specification
      Registry, cspec.genome.network, and the ClinGen Muscular Dystrophies
      and Myopathies GCEP's published scope, during batch 9 of this
      project's curated-set expansion; only a DMD gene-disease-validity
      curation exists, already reflected in gene_disease_validity above --
      that is a different, earlier stage of ClinGen curation than a VCEP's
      variant-level criteria specification). Until one exists, PM2/BS1
      OBSERVED-branch evaluation for DMD has no real spec-sourced number to
      compare against. Rather than inventing a fresh guess or silently
      misrepresenting a real observed frequency as ABSENT, this project
      reuses its own established generic-placeholder convention: the exact
      values (0.0001 / 0.001) that CAPN3 itself used as an explicitly
      disclosed placeholder before batch 4 replaced them with the real LGMD
      VCEP spec (see CAPN3's threshold_source above and the batch 4 README
      note -- CAPN3's own placeholder BS1 value of 0.001 turned out to
      match the real VCEP number once found). This is not a claim that
      0.0001/0.001 are correct for DMD specifically; it is the same
      disclosed placeholder role CAPN3 played through batch 3, kept
      separate per gene (not hardcoded) so a future real DMD VCEP spec can
      replace it the same way batch 4 did for CAPN3, without touching
      evaluator code. Added in batch 9 because DMD_c.11041A>T
      (p.Arg3681Ter) is this project's first real DMD fixture with a
      population_evidence.retrieval_status of OBSERVED rather than
      ABSENT -- every prior real DMD fixture happened to be genuinely
      absent from population databases, which meant this gap (PM2/BS1's
      OBSERVED branch raising SchemaValidationError for any gene without a
      configured threshold) had never been exercised by real data before.
      No ba1_af override is set for DMD: BA1's evaluator already has a safe
      global fallback (ba1_stand_alone_af, 5%) for any unconfigured gene,
      so no placeholder is needed there.
  CAPN3:
    pm2_max_credible_af: 0.0001   # 0.01%
    pm2_strength: SUPPORTING
    bs1_min_af: 0.001             # 0.1%
    ba1_af: 0.003                 # 0.3% — overrides the 5% generic default for this gene
    threshold_source: >
      ClinGen Limb-Girdle Muscular Dystrophy (LGMD) Variant Curation Expert
      Panel (VCEP) Specifications to the ACMG/AMP Variant Interpretation
      Guidelines for CAPN3, Version 2.0, released 2025-07-09.
      DOI: 10.5281/zenodo.21434844.
      Registry: cspec.genome.network/cspec/ui/svi/doc/GN187.
      PM2_Supporting: apply if the Grpmax variant allele frequency (or the
      upper bound of its 95% CI when >=3 alleles are observed in the Grpmax
      population) in gnomAD is <0.0001. This project approximates "Grpmax
      AF" with the overall_af / ancestry_specific_max_af fields already in
      PopulationEvidence and does not compute confidence intervals — a
      known simplification relative to the full VCEP procedure.
      BA1: apply if Grpmax FAF (lower bound of 95% CI) is >0.003. Note this
      is LOWER than the generic ACMG/AMP 5% default — an LGMD-VCEP-specific
      override, not a typo.
      BS1_Strong: apply if Grpmax FAF is >0.001 (this happens to match the
      value already in use here from the earlier placeholder — a
      coincidence confirmed correct once the real spec was found, not a
      value chosen to match).
      The VCEP spec also defines a Bayesian point-based combining system
      (Tavtigian et al. 2020 adaptation: Very Strong=8, Strong=4,
      Moderate=2, Supporting=1 point; Pathogenic >=10, Likely Pathogenic
      6-9, VUS 0-5, Likely Benign -6 to -1, Benign <=-7) rather than the
      classic Richards et al. 2015 Table 5 categorical rules. This
      prototype has NOT adopted that combining system — engine.py still
      uses Table 5 — so these VCEP-sourced per-criterion thresholds and
      strengths are applied within a combining framework the VCEP itself
      has moved away from. This has a real, visible consequence: Table 5
      has no rule for "1 Very Strong + 1 Supporting" alone, so a CAPN3
      variant whose only pathogenic evidence is PVS1 (Very Strong) + PM2
      (now Supporting, not Moderate) no longer reaches Likely Pathogenic
      here, even though the VCEP's own point system would score it
      8+1=9 points, within their Likely Pathogenic range (6-9). See
      CAPN3_c.1939G>T in variant_golden_cases.yaml for a real example, and
      the README's "Expanding the curated set" notes for the full writeup.
