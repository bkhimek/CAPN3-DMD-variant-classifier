# Case-level golden expectations for Milestone 4 (clinical.py), kept
# deliberately separate from variant_golden_cases.yaml: these test a
# different layer (case-level interpretation, consuming already-computed
# ProvisionalClassifications) against a different kind of fixture
# (ClinicalCase, not VariantEvidenceBundle) — see clinical.py's docstring
# for why case-level reasoning isn't folded into the per-variant
# evaluator/engine pattern.
#
# Written by hand against clinical.py's documented scope before the
# corresponding tests were run against it, same golden-case philosophy as
# variant_golden_cases.yaml: expectations curated independently of the
# code being tested.

case_interpretations:
  - case_id: CASE_CAPN3_BIALLELIC_TRANS
    expected_status: EXPLAINED
    source: "Hand-derived: both variants confirmed in trans, both individually Pathogenic/Likely Pathogenic"
    curator_note: >
      The clean positive case: two independently-classified pathogenic
      alleles, phase confirmed by (synthetic) parental testing. This is
      the only combination of inputs that should produce EXPLAINED for an
      autosomal recessive gene.

  - case_id: CASE_CAPN3_BIALLELIC_CIS
    expected_status: INSUFFICIENT
    source: "Hand-derived: same two variants as the trans case, but confirmed on the same allele"
    curator_note: >
      The clean negative case — just as important to get right as the
      positive one. Both variants are individually just as pathogenic as
      in the trans case; only the phase relationship differs, and that
      alone is enough to change the answer from EXPLAINED to
      INSUFFICIENT. If an implementation ever bases this decision on the
      variants' own classifications instead of phase, this case will
      catch it.

  - case_id: CASE_CAPN3_PHASE_UNKNOWN
    expected_status: MANUAL_REVIEW
    source: "Hand-derived: same two variants again, phase not established"
    curator_note: >
      Neither EXPLAINED nor INSUFFICIENT is honest here — the case could
      genuinely be either, depending on information this fixture doesn't
      have. MANUAL_REVIEW is the only defensible automated answer.

  - case_id: CASE_CAPN3_SINGLE_VARIANT
    expected_status: INSUFFICIENT
    source: "Hand-derived: one variant only, autosomal recessive gene"
    curator_note: >
      Uses the real ClinVar-grounded CAPN3_c.550del case on purpose: even
      a variant with strong individual evidence (PVS1 MET) is
      INSUFFICIENT on its own for a recessive disease case explanation.
      Deliberately does not depend on CAPN3_c.550del's own PM2/BS1
      manual-review nuance (see variant_golden_cases.yaml) — the "only one
      variant found" rule applies regardless of how strong that one
      variant's evidence is.

  - case_id: CASE_DMD_HEMIZYGOUS_MALE
    expected_status: EXPLAINED
    source: "Hand-derived: XY, single Likely Pathogenic variant, X-linked recessive gene"
    curator_note: >
      The clean X-linked case: a hemizygous male needs only one
      convincing variant, unlike the autosomal recessive cases above.

  - case_id: CASE_DMD_FEMALE_CARRIER
    expected_status: MANUAL_REVIEW
    source: "Hand-derived: same variant as the hemizygous male case, but karyotypic_sex=XX"
    curator_note: >
      Same variant, same individual classification — only the patient's
      karyotypic sex differs, and that alone changes the answer.
      Deliberately NOT resolved to EXPLAINED or INSUFFICIENT: female
      X-linked carrier interpretation depends on X-inactivation biology
      this project does not model, so guessing would be worse than
      admitting the gap (see clinical.py's module docstring).

  - case_id: CASE_DMD_HEMIZYGOUS_MALE_REAL
    expected_status: EXPLAINED
    source: "Hand-derived: XY, single real Likely Pathogenic variant (DMD_c.2302C>T, ClinVar Variation ID 11222), X-linked recessive gene"
    curator_note: >
      Batch 12: the project's first Milestone 4 clinical case built on a
      REAL variant rather than a synthetic one. Every prior clinical
      case (this file's first six entries) used
      DMD_SYNTH_PATHOGENIC_01/CAPN3_SYNTH_PATHOGENIC_01/02 or, for the
      single-variant recessive case, CAPN3_c.550del -- but no real DMD
      variant had ever been wired into a case-level fixture, despite the
      project accumulating several real, cleanly LIKELY_PATHOGENIC DMD
      variants across batches 7-11. Uses DMD_c.2302C>T (real ClinVar
      nonsense variant, absent from gnomAD, PVS1 Very Strong + PM2
      Moderate). Same reasoning as CASE_DMD_HEMIZYGOUS_MALE, now
      end-to-end real rather than synthetic-variant-plus-real-logic.

  - case_id: CASE_DMD_FEMALE_CARRIER_REAL
    expected_status: MANUAL_REVIEW
    source: "Hand-derived: same real variant as the hemizygous male case above, but karyotypic_sex=XX"
    curator_note: >
      Batch 12, paired with CASE_DMD_HEMIZYGOUS_MALE_REAL. Same variant,
      same individual classification -- only karyotypic_sex differs, and
      that alone changes the answer, exactly as the synthetic-variant
      pair already demonstrated. Grounded here in real biology, not just
      an abstract "what if XX" scenario: DMD manifesting carriers are a
      well-documented real phenomenon (2.5-7.8% report muscle weakness;
      up to ~8% present with dilated cardiomyopathy), and X-inactivation
      skewing is often invoked as the mechanism but does not reliably
      predict phenotype -- Brioschi et al., "Genetic characterization in
      symptomatic female DMD carriers: lack of relationship between
      X-inactivation, transcriptional DMD allele balancing and
      phenotype", BMC Med Genet 2012;13:73, DOI 10.1186/1471-2350-13-73,
      found skewed X-inactivation in only 2 of 6 symptomatic carriers and
      in 5 of 11 asymptomatic ones. That real-world unpredictability is
      precisely why this project's MANUAL_REVIEW here is the honest
      answer rather than a gap to be embarrassed about: even the
      published literature cannot cleanly predict a carrier's phenotype
      from genotype plus X-inactivation pattern alone, so an automated
      engine confidently resolving this to EXPLAINED or INSUFFICIENT
      would be claiming more certainty than the field itself has.

  - case_id: CASE_DMD_HEMIZYGOUS_MALE_VUS_REAL
    expected_status: MANUAL_REVIEW
    source: "Hand-derived: XY, single real VUS-classified variant (DMD_c.10103A>G), X-linked recessive gene"
    curator_note: >
      Batch 17. Closes a genuine, previously-untested branch of
      interpret_x_linked_case: every prior X-linked case fixture (six of
      them, across batches 1-12) used a variant individually classified
      either (Likely) Pathogenic or (Likely) Benign -- no curated fixture,
      real or synthetic, had ever exercised the function's final
      catch-all path (karyotypic_sex=XY, but the variant's own
      classification is neither qualifying nor benign-side), even though
      the code has always had that branch. Found the same way PM4's gap
      was found (batch 14): checking what the curated set actually
      exercises, not assuming coverage from the code existing.

      Uses DMD_c.10103A>G's real hemizygous case directly: the source
      paper's proband (index case) has an unspecified de novo missense
      variant; her 8-year-old son is hemizygous for the same variant and
      presents with elevated CK and calf hypertrophy, but was diagnosed
      only with "unspecified myopathy due to DMD defect" -- his own
      treating clinicians did not resolve his case to a confident
      Duchenne/Becker diagnosis either. This engine's MANUAL_REVIEW
      answer (variant classified VUS, not yet conclusive on its own)
      independently lands in the same place real clinical practice did
      for this exact patient -- not a coincidence, since both are
      following the same underlying evidence (a variant with real but
      currently insufficient evidence), but a nice confirmation that the
      case-level layer's honesty holds up against a real, messy,
      still-unresolved case rather than only clean textbook ones.

  - case_id: CASE_DMD_XX_BIALLELIC_TRANS
    expected_status: EXPLAINED
    source: "Hand-derived: XX, two real LIKELY_PATHOGENIC DMD variants (DMD_c.2302C>T, DMD_c.8944C>T), confirmed in trans"
    curator_note: >
      Batch 29. Extends interpret_x_linked_case beyond the hemizygous-
      male-only case: karyotypic_sex=XX now supports one OR two
      variant_ids (ClinicalCase itself already allowed this generically;
      only interpret_x_linked_case's own 1-variant-only check was
      relaxed). Both copies of DMD carry an independently
      LIKELY_PATHOGENIC variant, confirmed in trans -- a real,
      documented mechanism for biallelic DMD involvement in females,
      independent of X-inactivation (see clinical.py's
      _interpret_xx_biallelic docstring, citing Ulm et al. 2022,
      Molecular Genetics & Genomic Medicine 11:e2088; Fujii et al. 2009,
      Am J Med Genet A 149A:1052; Takeshita et al. 2017). The CASE here
      is synthetic (no real published case pairs these exact two
      variants), but both underlying variants are real and already
      curated -- same "synthetic case, real variant evidence" pattern as
      CASE_DMD_FEMALE_CARRIER_REAL. Resolves to EXPLAINED because no
      genuinely functional DMD copy exists in any cell for
      X-inactivation to preferentially spare -- unlike the pre-existing
      CASE_DMD_FEMALE_CARRIER(_REAL) fixtures, which have only one
      variant and correctly remain MANUAL_REVIEW.

  - case_id: CASE_DMD_XX_BIALLELIC_CIS
    expected_status: MANUAL_REVIEW
    source: "Hand-derived: same two real variants as CASE_DMD_XX_BIALLELIC_TRANS, but confirmed in cis"
    curator_note: >
      Batch 29, deliberately paired with CASE_DMD_XX_BIALLELIC_TRANS to
      exercise the one place this project's new XX-biallialic logic
      diverges from interpret_recessive_case's existing cis handling:
      autosomal recessive cis resolves to INSUFFICIENT (the other
      autosome copy is always active, so a truly wild-type copy is
      genuinely protective), but X-linked cis stays MANUAL_REVIEW,
      because the other X chromosome copy -- though genuinely
      wild-type here -- is not always active. X-inactivation randomly
      silences one X per cell, so a wild-type second copy can still be
      silenced in some cells, carrying the same real, published
      phenotype unpredictability (Brioschi et al. 2012, already cited
      for the single-heterozygous-carrier case) rather than being
      confidently ruled out. See clinical.py's _interpret_xx_biallelic
      docstring for the full reasoning.
