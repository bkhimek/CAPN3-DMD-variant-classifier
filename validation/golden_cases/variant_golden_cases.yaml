      PP3 (Supporting) gives "1 Very Strong + >=2 Supporting", a real
      Table 5 Pathogenic path -- so this fixture now reaches PATHOGENIC
      (stronger than its original LIKELY_PATHOGENIC, not just restored to
      it). This is a deliberate, disclosed strengthening of a fully
      SYNTHETIC fixture to preserve its original test purpose -- contrast
      with CAPN3_c.1939G>T below, a REAL variant left unmodified, which
      shows the same threshold change's honest, unmitigated consequence
      instead. See config/population_thresholds.yaml's threshold_source
      note and data/curated/variant_evidence.json's notes field on this
      fixture for the full reasoning.

