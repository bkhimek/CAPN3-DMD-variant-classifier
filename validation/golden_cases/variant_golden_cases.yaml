      BS1: NOT_MET
      BS3: NOT_EVALUATED
    source: "Hand-derived from ACMG/AMP combining rules (Richards et al. 2015, Table 5), applied to a real ClinVar entry (Variation ID 21036)"
    curator_note: >
      Real, ClinVar-reported Pathogenic canonical splice acceptor variant
      with experimental (not just predicted) evidence of disrupted
      splicing, absent from gnomAD/ExAC. This project's PVS1 evaluator
      does not auto-resolve splice-site variants (see pvs1.py, "PVS1
      scope") -- it correctly returns MANUAL_REVIEW rather than guessing.
      With PVS1 unresolved, only PM2 (Moderate) is MET, which alone never
      reaches any Table 5 tier -- VUS. This is the clearest demonstration
      in the fixture set of the PVS1 scope gap costing something real: a
      confidently Pathogenic ClinVar variant, with wet-lab splicing
      evidence behind it, that this engine cannot currently call anything
      stronger than Uncertain Significance. A good candidate to revisit
      if/when PVS1's splice-outcome modeling is extended.

