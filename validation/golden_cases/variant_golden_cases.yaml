    expected_provisional_class: PATHOGENIC
    expected_criterion_status:
      PVS1: MET
      PM2: MET
      PM4: NOT_APPLICABLE
      PS1: NOT_APPLICABLE
      PM5: NOT_APPLICABLE
      PS3: NOT_EVALUATED
      PP3: MET
      BP4: NOT_MET
      BA1: NOT_MET
      BS1: NOT_MET
      BS3: NOT_EVALUATED
    source: "Hand-derived from ACMG/AMP combining rules (Richards et al. 2015, Table 5)"
    curator_note: >
      Synthetic, built in Milestone 4 as CAPN3_SYNTH_PATHOGENIC_01's trans
      partner for case-level interpretation tests (see
      case_interpretation_golden_cases.yaml). UPDATED in batch 4: this
      fixture's computational_evidence (PP3, calibrated pathogenic) was
      added specifically because the real ClinGen LGMD VCEP CAPN3 PM2 is
      Supporting strength, not Moderate -- with only PVS1 (Very Strong) +
      PM2 (Supporting), Table 5 has no combining rule at all for "1 Very
      Strong + 1 Supporting" alone, so this fixture would otherwise drop
      from its original LIKELY_PATHOGENIC to VUS and CASE_CAPN3_BIALLELIC_TRANS
      would no longer demonstrate a clean EXPLAINED biallelic case. Adding
      PP3 (Supporting) gives "1 Very Strong + >=2 Supporting", a real
      Table 5 Pathogenic path -- so this fixture now reaches PATHOGENIC
      (stronger than its original LIKELY_PATHOGENIC, not just restored to
      it). This is a deliberate, disclosed strengthening of a fully
      SYNTHETIC fixture to preserve its original test purpose -- contrast
      with CAPN3_c.1939G>T below, a REAL variant left unmodified, which
      shows the same threshold change's honest, unmitigated consequence
      instead. See config/population_thresholds.yaml's threshold_source
      note and data/curated/variant_evidence.json's notes field on this
      fixture for the full reasoning.

