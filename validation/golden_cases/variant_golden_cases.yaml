# Variant-level golden cases (expected per-criterion status and final
# ProvisionalClassification for individual variants). Originally named
# capn3_milestone1.yaml when only CAPN3 fixtures existed; renamed here in
# Milestone 4 once a DMD variant was added, since the old name was no
# longer accurate. Case-level golden expectations (Milestone 4's
# ClinicalCase/CaseInterpretation reasoning) are a separate file,
# case_interpretation_golden_cases.yaml — deliberately not merged into
# this one, since they test a different layer (clinical.py, not
# engine.py) against a different kind of fixture (ClinicalCase, not
# VariantEvidenceBundle).
#
# Deliberately kept in validation/golden_cases/, separate from
# data/curated/, per the Validation and Verification Design Guide's
# golden-case philosophy: expected results are curated independently of
# the evidence bundle they judge, so a future evaluator is tested against
# an outside opinion, not its own assumptions.
#
# The three original entries were written in Milestone 1, before any
# evaluator or combining engine existed — worked out by hand against the
# ACMG/AMP combining rules (Richards et al. 2015, Table 5). Milestone 2
# (PM2, PVS1 evaluators) and Milestone 3 (BA1/BS1/PP3/BP4 evaluators +
# engine.combine()) are checked against these, matching exactly, including
# the CAPN3_c.550del BS1 correction noted below. The two Milestone 4
# entries (CAPN3_SYNTH_PATHOGENIC_02, DMD_SYNTH_PATHOGENIC_01) were added
# specifically to support the new case-level tests and are worked out the
# same way.

# Batch 4 (curated-set expansion): CAPN3 moved from a placeholder PM2/BA1
# threshold to the real ClinGen LGMD VCEP CAPN3 specification (v2.0,
# 2025-07-09; see config/population_thresholds.yaml). This changed PM2's
# strength for CAPN3 from Moderate to Supporting and BA1's threshold from
# the generic 5% to a gene-specific 0.3%, which changed the expected
# result for several existing entries below. Each changed entry's
# curator_note explains what changed and why, rather than silently
# updating the number. CAPN3_SYNTH_PATHOGENIC_02's evidence was also
# strengthened (PP3 added) specifically to preserve a clean, individually-
# qualifying case-level fixture; real fixtures affected by the same
# threshold change were left unmodified and show the honest result
# instead -- see CAPN3_c.1939G>T.

golden_cases:
  - variant_id: CAPN3_c.550del
    expected_provisional_class: PATHOGENIC
    expected_criterion_status:
      PVS1: MET
      PM2: NOT_MET
      PM4: NOT_APPLICABLE
      PS1: NOT_APPLICABLE
      PM5: NOT_APPLICABLE
      PM3: MET
      PS3: MET
      PP3: NOT_EVALUATED
      BP4: NOT_EVALUATED
      BA1: MANUAL_REVIEW
      BS1: MANUAL_REVIEW
      BS3: NOT_MET
    source: "Hand-derived from ACMG/AMP combining rules (Richards et al. 2015, Table 5), applied to the curated evidence in data/curated/variant_evidence.json, using the real ClinGen LGMD VCEP CAPN3 PM2/BA1/BS1 thresholds (batch 4)"
    curator_note: >
      Deliberately NOT auto-classified as Likely Pathogenic despite the real
      ClinVar Pathogenic call. PVS1 alone (1 Very Strong) is insufficient by
      itself under Table 5. UPDATED in batch 4: PM2 is now NOT_MET rather
      than MANUAL_REVIEW. Under the real VCEP's stricter PM2_Supporting
      threshold (<0.0001), this variant's overall AF (0.023% = 0.00023)
      already exceeds the threshold on its own, so PM2 is decided (too
      common) before the ancestry-specific check is even reached -- unlike
      before, when the looser placeholder threshold (0.001) let the overall
      AF pass and only the ancestry-specific frequency (0.75%) triggered
      ambiguity. BA1 flips the other way: it is now MANUAL_REVIEW rather
      than NOT_MET, because the real VCEP's BA1 threshold for CAPN3 (0.3%)
      is far stricter than the generic 5% default, and this variant's
      ancestry-specific frequency (0.75%) clears it even though the overall
      frequency (0.023%) does not -- the same founder-enrichment ambiguity
      PM2 used to show, now showing up in BA1 instead. BS1 is unaffected
      (still MANUAL_REVIEW for the same founder-frequency reason as before;
      its threshold, 0.001, was already correct once the placeholder was
      checked against the real spec). BA1 and BS1 remain MANUAL_REVIEW even
      after this fixture reaches PATHOGENIC below -- the engine does not
      silently suppress that flag just because a pathogenic combining rule
      was also satisfied; manual_review_required stays True
      (test_founder_case_reaches_pathogenic_but_still_flags_manual_review).
      UPDATED in batch 25: PS3 is now MET (Supporting) via a real curated
      functional_evidence record -- a Czech LGMD2A cohort Western blot
      study (Chrobakova et al. 2004 / Hermanova et al. 2006) reporting
      total absence of calpain-3 protein in patients carrying this exact
      founder allele. Supporting strength was chosen as a disclosed
      conservative floor since the primary papers' exact validation-control
      counts were not independently verifiable during curation (see the
      functional_evidence.notes field in data/curated/variant_evidence.json
      for the full writeup). With PS3 alone added, Table 5 landed this on
      VUS: "1 Very Strong + 1 Supporting" (PVS1 + PS3) has no Table 5
      combining rule of its own -- the same shape as CAPN3_c.1939G>T's PVS1
      + PM2(Supporting) case. UPDATED in batch 28: this is the change that
      finally moves the fixture off VUS. Real literature documents
      c.550delA (this project's c.550del) recurrently homozygous across
      multiple independent European LGMD2A cohorts (Czech: Chrobakova et
      al. 2004 / Hermanova et al. 2006; Polish: "The Frequency of
      c.550delA Mutation of the CANP3 Gene in the Polish LGMD2A
      Population") -- curated here as two independent-cohort HOMOZYGOUS
      PM3 observations, each capped at the real ACGS-2024-quoted 1.0-point
      homozygous ceiling, summing to 2.0 points = PM3 MET/Strong under the
      CAPN3 VCEP's own real threshold table. PVS1 (Very Strong) + PM3
      (Strong) satisfies Table 5's "1 Very Strong + >=1 Strong" pathogenic
      rule directly -- PATHOGENIC, finally matching the real ClinVar call
      this fixture's notes have flagged as out of reach since Milestone 3
      ("The real-world Pathogenic classification for this variant also
      draws on segregation/case-count evidence (PM3, PS4-adjacent) that is
      entirely out of scope for this project's 6-criterion engine" -- no
      longer true as of batch 28). This is also this project's first
      fixture to reach a Strong-strength pathogenic-direction evaluator at
      all (PM3 is Strong here; every other pathogenic evaluator this
      project has is Very Strong, Moderate, or Supporting) -- see
      engine.py's module docstring. See
      variant_golden_cases_bayesian.yaml: under Tavtigian et al. 2020's
      point system this evidence is now 8 (PVS1) + 1 (PS3) + 4 (PM3
      Strong) = 13 points, >=10 = Pathogenic -- both systems now agree,
      so this fixture is NO LONGER a Table-5-vs-Bayesian divergence case
      (it was one from batch 25 through batch 27; see
      test_bayesian_diverges_from_table5_for_exactly_the_four_documented_fixtures
      for the corrected, smaller list).

