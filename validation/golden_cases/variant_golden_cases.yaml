      With PVS1 unresolved, only PM2 (Moderate) is MET, which alone never
      reaches any Table 5 tier -- VUS. This is the clearest demonstration
      in the fixture set of the PVS1 scope gap costing something real: a
      confidently Pathogenic ClinVar variant, with wet-lab splicing
      evidence behind it, that this engine cannot currently call anything
      stronger than Uncertain Significance. A good candidate to revisit
      if/when PVS1's splice-outcome modeling is extended.

