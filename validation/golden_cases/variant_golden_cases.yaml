  - variant_id: CAPN3_c.1939G>T
    expected_provisional_class: VUS
    expected_criterion_status:
      PVS1: MET
      PM2: MET
      PM4: NOT_APPLICABLE
      PS1: NOT_APPLICABLE
      PM5: NOT_APPLICABLE
      PS3: NOT_EVALUATED
      PP3: NOT_EVALUATED
      BP4: NOT_EVALUATED
      BA1: NOT_MET
      BS1: NOT_MET
      BS3: NOT_EVALUATED
    source: "Hand-derived from ACMG/AMP combining rules (Richards et al. 2015, Table 5), applied to a real ClinVar entry (Variation ID 217153), using the real ClinGen LGMD VCEP CAPN3 PM2 threshold/strength (batch 4)"
    curator_note: >
      Real, ClinVar-reported Pathogenic nonsense variant, gnomAD AF
      0.003% (no ancestry-enrichment complication, unlike CAPN3_c.550del).
      UPDATED in batch 4, and deliberately LEFT as the honest result of
      the real VCEP threshold change rather than patched: PM2 is still MET
      (0.003% clears the real, stricter <0.01% threshold easily), but its
      strength is now Supporting, not Moderate, per the real ClinGen LGMD
      VCEP spec for CAPN3. PVS1 (Very Strong) + PM2 (Supporting) is "1 Very
      Strong + 1 Supporting", which Table 5 has NO combining rule for --
      not Likely Pathogenic, not Pathogenic, nothing. So this real,
      ClinVar-Pathogenic variant now lands on VUS here, down from
      LIKELY_PATHOGENIC before batch 4. This is a genuine, informative
      finding, not a bug: the real VCEP's own Bayesian point-based
      combining system (Tavtigian et al. 2020) would score this exact
      evidence as 8 (Very Strong) + 1 (Supporting) = 9 points, within
      their Likely Pathogenic range (6-9) -- it is specifically this
      project's continued use of the classic, categorical Table 5 rules
      (rather than adopting the VCEP's point system) that creates this
      gap. See config/population_thresholds.yaml's threshold_source note
      for the full explanation. This is the clearest concrete illustration
      in the fixture set of why real VCEPs moved from Table 5 to Bayesian
      point-based combining, and a strong motivating example for revisiting
      that combining-system question later (see README roadmap).

  - variant_id: CAPN3_c.2257G>A
    expected_provisional_class: VUS
    expected_criterion_status:
      PVS1: NOT_APPLICABLE
      PM2: NOT_MET
      PM4: NOT_APPLICABLE
      PS1: NOT_EVALUATED
      PM5: NOT_EVALUATED
      PS3: NOT_MET
      PP3: NOT_MET
      BP4: NOT_MET
      BA1: NOT_MET
      BS1: MET
      BS3: NOT_MET
    source: "Hand-derived from ACMG/AMP combining rules (Richards et al. 2015, Table 5), applied to a real, recurrent CAPN3 variant (p.Asp753Asn, ClinVar VCV000281081.42), using the real ClinGen LGMD VCEP CAPN3 thresholds (batch 4) and a real REVEL score (batch 8), coordinates and VCEP details primary-source-confirmed and a real dominant-calpainopathy paper added in batch 10"
    curator_note: >
      Real and genuinely contested in the literature -- not a clean
      textbook case, included deliberately for that reason. gnomAD AF
      (0.002457, Middle-Eastern-subpopulation-driven) clears this
      project's BS1 threshold, giving BS1 MET alone. Per Table 5, BS1
      alone is insufficient for LIKELY_BENIGN (needs a Supporting-benign
      criterion too) -- so the engine lands on VUS. UPDATED in batch 8:
      added this variant's real REVEL score (0.649) as computational
      evidence -- below the real VCEP's PP3 threshold (>=0.70) but above
      its BP4 threshold (<=0.10), so genuinely INDETERMINATE, and both
      PP3 and BP4 correctly return NOT_MET rather than either one
      guessing. Also found (via web search, not independently verified
      against the primary erepo.clinicalgenome.org record) that the real
      LGMD VCEP's own current classification for this exact variant is
      LIKELY BENIGN, reached via BS1 + BP2 -- a case-level criterion
      ('in trans with a pathogenic variant... or in cis') this project
      does not implement at all.
      UPDATED in batch 10, twice over. First, the VCEP classification is
      now primary-source-confirmed (fetched the ClinVar VCV page
      directly): the LGMD VCEP's official 3-star expert-panel record
      (evaluated 2025-10-28) does say Likely Benign via BS1+BP2, exactly
      as batch 8 found secondhand -- and also gives real coordinates
      (GRCh38 chr15:42410660 G>A), now recorded with
      coordinate_verified=true. Second, and more interesting: a
      peer-reviewed paper published one month after that VCEP evaluation
      (Bruno et al. 2025, Int J Mol Sci 26(23):11384, PMID 41373542)
      reports this exact variant as the single most frequent finding (8
      of 59 patients, 13.5%) in a multicenter Italian cohort of
      CAPN3-heterozygous patients, with real phenotypic data and new
      structural modeling, concluding "the aggregated evidence supports a
      pathogenic role." This is not a contradiction of the VCEP's
      numbers -- both cite essentially the same gnomAD frequency and
      REVEL score -- it's a different question: the VCEP classified this
      variant Likely Benign FOR AUTOSOMAL RECESSIVE calpainopathy; the
      paper argues for pathogenicity in a distinct, less common AUTOSOMAL
      DOMINANT calpainopathy (LGMDD4) model. This project's
      gene_disease_context.yaml fixes CAPN3 as one inheritance pattern
      (AUTOSOMAL_RECESSIVE) for every variant, so it structurally cannot
      represent "benign for recessive disease, possibly pathogenic for
      dominant disease" as a single variant's answer -- a schema-level
      gap, not a missing criterion, previously only mentioned here in
      passing and now fully primary-source-documented on both sides. The
      engine's own VUS call ends up being the most epistemically honest
      of the three real answers on the table (VCEP: Likely Benign;
      paper: pathogenic-leaning; this project: uncertain) specifically
      because it commits to neither disease model -- a fortunate
      byproduct of missing criteria, not a designed strength, and worth
      being honest about which it is.
      UPDATED in batch 25: PS3/BS3 are both NOT_MET, via a real curated
      functional_evidence record from the SAME Bruno et al. 2025 paper
      already cited above. That paper's own Table 1 reports Western blot
      calpain-3 expression for this variant's 8 heterozygous carriers as
      genuinely mixed (Normal in 3 of 5 tested, variably Reduced in the
      other 2), and the paper explicitly cautions that even a Normal
      result cannot be trusted as benign for this gene ("approximately
      20% of individuals with pathogenic CAPN3 variants may have normal
      protein levels despite functional impairment"). assay_result is
      curated as INDETERMINATE rather than forcing a NORMAL or ABNORMAL
      call either direction would misrepresent the source -- a real-world
      case that concretely motivates FunctionalEvidence's three-way
      assay_result design (see models/functional_evidence.py) rather than
      a boolean damaging/non-damaging flag. Net effect on this fixture's
      classification: none -- still VUS, for the same schema-level
      single-inheritance-pattern reason as before; PS3/BS3 simply confirm
      that functional evidence, like everything else in this contested
      variant's record, does not resolve the ambiguity either.

