# Variant-level golden cases (expected per-criterion status and final
# ProvisionalClassification for individual variants). Originally named
# capn3_milestone1.yaml when only CAPN3 fixtures existed; renamed here in
# Milestone 4 once a DMD variant was added, since the old name was no
# longer accurate. Case-level golden expectations (Milestone 4's
# ClinicalCase/CaseInterpretation reasoning) are a separate file,
# case_interpretation_golden_cases.yaml — deliberately not merged into
# this one, since they test a different layer (clinical.py, not
# engine.py) against a different kind of fixture (ClinicalCase, not
# VariantEvidenceBundle).
#
# Deliberately kept in validation/golden_cases/, separate from
# data/curated/, per the Validation and Verification Design Guide's
# golden-case philosophy: expected results are curated independently of
# the evidence bundle they judge, so a future evaluator is tested against
# an outside opinion, not its own assumptions.
#
# The three original entries were written in Milestone 1, before any
# evaluator or combining engine existed — worked out by hand against the
# ACMG/AMP combining rules (Richards et al. 2015, Table 5). Milestone 2
# (PM2, PVS1 evaluators) and Milestone 3 (BA1/BS1/PP3/BP4 evaluators +
# engine.combine()) are checked against these, matching exactly, including
# the CAPN3_c.550del BS1 correction noted below. The two Milestone 4
# entries (CAPN3_SYNTH_PATHOGENIC_02, DMD_SYNTH_PATHOGENIC_01) were added
# specifically to support the new case-level tests and are worked out the
# same way.

golden_cases:
  - variant_id: CAPN3_c.550del
    expected_provisional_class: VUS
    expected_criterion_status:
      PVS1: MET
      PM2: MANUAL_REVIEW
      PP3: NOT_EVALUATED
      BP4: NOT_EVALUATED
      BA1: NOT_MET
      BS1: MANUAL_REVIEW
    source: "Hand-derived from ACMG/AMP combining rules (Richards et al. 2015, Table 5), applied to the curated evidence in data/curated/variant_evidence.json"
    curator_note: >
      Deliberately NOT auto-classified as Likely Pathogenic despite the real
      ClinVar Pathogenic call. PVS1 alone (1 Very Strong) is insufficient by
      itself under Table 5. PM2 is marked MANUAL_REVIEW rather than MET
      because this is a known founder allele with a much higher
      ancestry-specific frequency (0.75%) than global frequency (0.023%) —
      whether that's "extremely low frequency" for PM2 purposes depends on
      knowing the tested individual's ancestry, which this fixture does not
      specify. BS1 is MANUAL_REVIEW for the identical reason, updated from
      an earlier (Milestone 1) NOT_MET once the Milestone 3 evaluators made
      the inconsistency visible: the same ancestry-specific frequency that
      makes PM2 ambiguous makes BS1 equally ambiguous — a founder pathogenic
      allele can be locally common without being benign, so BS1 shouldn't
      be silently resolved to NOT_MET any more than PM2 should be silently
      resolved to MET. The real-world Pathogenic classification for this
      variant also draws on segregation/case-count evidence (PM3,
      PS4-adjacent) that is entirely out of scope for Milestone 1's
      6-criterion engine. This golden case exists specifically to prove the
      prototype does NOT overclaim certainty it has no evidence for — with
      two criteria now correctly flagged for human review instead of one.

  - variant_id: CAPN3_SYNTH_PATHOGENIC_01
    expected_provisional_class: PATHOGENIC
    expected_criterion_status:
      PVS1: MET
      PM2: MET
      PP3: MET
      BP4: NOT_MET
      BA1: NOT_MET
      BS1: NOT_MET
    source: "Synthetic fixture constructed to exercise Table 5 combining-rule path (iii): 1 Very Strong + 1 Moderate + ≥1 Supporting"
    curator_note: >
      Confirms the combination engine can reach PATHOGENIC through the
      VS+M+Supporting path, not just VS+S. This path only exists in the
      Milestone-1 criterion set because PP3 is included.

  - variant_id: CAPN3_SYNTH_LIKELY_BENIGN_01
    expected_provisional_class: LIKELY_BENIGN
    expected_criterion_status:
      PVS1: NOT_APPLICABLE
      PM2: NOT_MET
      PP3: NOT_MET
      BP4: MET
      BA1: NOT_MET
      BS1: MET
    source: "Synthetic fixture constructed to exercise Table 5 combining-rule path: 1 Strong-Benign + 1 Supporting-Benign"
    curator_note: >
      This is the fixture that specifically tests the fix for the
      LIKELY_BENIGN-unreachable bug identified during Project 1 planning
      review: the original 5-criterion set (PVS1/PM2/PP3/BA1/BS1) had no
      Supporting-Benign criterion at all, so BS1 alone could never combine
      to LIKELY_BENIGN. BP4's addition closes that gap. AF (1.4% overall,
      2.1% ancestry-max) is deliberately below a plausible BA1 threshold so
      this case exercises the BS1+BP4 path rather than the stand-alone BA1
      path.

  - variant_id: CAPN3_SYNTH_PATHOGENIC_02
    expected_provisional_class: LIKELY_PATHOGENIC
    expected_criterion_status:
      PVS1: MET
      PM2: MET
      PP3: NOT_EVALUATED
      BP4: NOT_EVALUATED
      BA1: NOT_MET
      BS1: NOT_MET
    source: "Hand-derived from ACMG/AMP combining rules (Richards et al. 2015, Table 5)"
    curator_note: >
      Synthetic, built in Milestone 4 as CAPN3_SYNTH_PATHOGENIC_01's trans
      partner for case-level interpretation tests (see
      case_interpretation_golden_cases.yaml). Reaches LIKELY_PATHOGENIC via
      the VS+1 Moderate combining path (PVS1+PM2, no computational
      evidence gathered) — deliberately not the same path as
      CAPN3_SYNTH_PATHOGENIC_01 (which also has PP3), to keep the two
      fixtures genuinely distinct rather than copies of each other.

  - variant_id: DMD_SYNTH_PATHOGENIC_01
    expected_provisional_class: LIKELY_PATHOGENIC
    expected_criterion_status:
      PVS1: MET
      PM2: MET
      PP3: NOT_EVALUATED
      BP4: NOT_EVALUATED
      BA1: NOT_MET
      BS1: NOT_MET
    source: "Hand-derived from ACMG/AMP combining rules (Richards et al. 2015, Table 5)"
    curator_note: >
      Synthetic, the project's first DMD fixture, built in Milestone 4 for
      hemizygous X-linked case-level interpretation tests. Same
      VS+1 Moderate combining path as CAPN3_SYNTH_PATHOGENIC_02. A
      point/small-variant, not the multi-exon deletion pattern common in
      real DMD pathogenic variants — see gene_disease_context.yaml.

  - variant_id: CAPN3_c.1939G>T
    expected_provisional_class: LIKELY_PATHOGENIC
    expected_criterion_status:
      PVS1: MET
      PM2: MET
      PP3: NOT_EVALUATED
      BP4: NOT_EVALUATED
      BA1: NOT_MET
      BS1: NOT_MET
    source: "Hand-derived from ACMG/AMP combining rules (Richards et al. 2015, Table 5), applied to a real ClinVar entry (Variation ID 217153)"
    curator_note: >
      Real, ClinVar-reported Pathogenic nonsense variant, gnomAD AF
      0.003% (no ancestry-enrichment complication, unlike CAPN3_c.550del).
      PVS1 MET + PM2 MET reaches LIKELY_PATHOGENIC via the VS+1 Moderate
      path -- not full PATHOGENIC, because no computational evidence was
      gathered for this variant (PP3 NOT_EVALUATED), and this project's
      6-criterion engine has no other path to the Pathogenic tier from a
      single Very Strong + Moderate pair. This is expected and correct
      given the criterion scope, not a bug: it demonstrates the engine
      declining to overclaim a full Pathogenic call it doesn't have
      complete evidence for, even for a variant ClinVar itself calls
      Pathogenic.

  - variant_id: CAPN3_c.2257G>A
    expected_provisional_class: VUS
    expected_criterion_status:
      PVS1: NOT_APPLICABLE
      PM2: NOT_MET
      PP3: NOT_EVALUATED
      BP4: NOT_EVALUATED
      BA1: NOT_MET
      BS1: MET
    source: "Hand-derived from ACMG/AMP combining rules (Richards et al. 2015, Table 5), applied to a real, recurrent CAPN3 variant (p.Asp753Asn)"
    curator_note: >
      Real and genuinely contested in the literature -- not a clean
      textbook case, included deliberately for that reason. gnomAD AF
      (0.002457, Middle-Eastern-subpopulation-driven) clears this
      project's BS1 threshold, giving BS1 MET alone. Per Table 5, BS1
      alone is insufficient for LIKELY_BENIGN (needs a Supporting-benign
      criterion too, the same gap BP4 was added to close for the
      synthetic fixtures) -- so the engine lands on VUS. That VUS is
      defensible given only 6 criteria are implemented, but it should not
      be read as "probably benign, case closed": recent (2025) literature
      proposes this variant may represent a low-penetrance AUTOSOMAL
      DOMINANT calpainopathy mechanism entirely distinct from the
      recessive LGMDR1 model this project's CAPN3 gene_disease_context
      assumes for every variant. This project cannot represent that
      possibility (one fixed inheritance pattern per gene) -- flagged here
      explicitly rather than silently mismodeled.

  - variant_id: CAPN3_c.946-1G>A
    expected_provisional_class: VUS
    expected_criterion_status:
      PVS1: MANUAL_REVIEW
      PM2: MET
      PP3: NOT_EVALUATED
      BP4: NOT_EVALUATED
      BA1: NOT_MET
      BS1: NOT_MET
    source: "Hand-derived from ACMG/AMP combining rules (Richards et al. 2015, Table 5), applied to a real ClinVar entry (Variation ID 21036)"
    curator_note: >
      Real, ClinVar-reported Pathogenic canonical splice acceptor variant
      with experimental (not just predicted) evidence of disrupted
      splicing, absent from gnomAD/ExAC. This project's PVS1 evaluator
      does not auto-resolve splice-site variants (see pvs1.py, "PVS1
      scope") -- it correctly returns MANUAL_REVIEW rather than guessing.
      With PVS1 unresolved, only PM2 (Moderate) is MET, which alone never
      reaches any Table 5 tier -- VUS. This is the clearest demonstration
      in the fixture set of the PVS1 scope gap costing something real: a
      confidently Pathogenic ClinVar variant, with wet-lab splicing
      evidence behind it, that this engine cannot currently call anything
      stronger than Uncertain Significance. A good candidate to revisit
      if/when PVS1's splice-outcome modeling is extended.
