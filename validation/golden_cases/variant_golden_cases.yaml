    source: "Hand-derived from ACMG/AMP combining rules (Richards et al. 2015, Table 5), applied to a synthetic fixture built to exercise PS1's MET/Strong path"
    curator_note: >
      SYNTHETIC fixture, modeled directly on Richards et al. 2015's own
      PS1 example ("Val->Leu caused by either G>C or G>T in the same
      codon"). No real CAPN3 or DMD example of two different nucleotide
      changes producing the exact same resulting amino acid change, where
      one is already established pathogenic, was found while researching
      real PS1/PM5 fixtures this batch -- unlike PM5, which did get a
      real fixture (CAPN3_c.1342C>T / CAPN3_c.1343G>A). Disclosed as an
      open real-data gap for PS1 specifically, the same "searched, not
      found, still open" treatment given to other real-data gaps
      elsewhere in this project (e.g. BA1, before batch 18 closed it).

      PS1 Strong (4 points) + PM2 Supporting (ABSENT from gnomAD) + PP3
      Supporting (synthetic REVEL 0.9, PATHOGENIC bucket) clears Table
      5's "1 Strong + >=2 Supporting" Likely Pathogenic rule -- chosen
      deliberately to give PS1 a complete classification-tier
      demonstration, not just an isolated MET result.
