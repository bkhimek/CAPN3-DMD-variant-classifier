# Gene/disease-level configuration, curated by hand for Milestone 1.
# See ACMG Engine Detailed Design Guide, Section 6, "Applicability and rule
# precedence" — this is deliberately data, not code, so adding a gene never
# requires touching the evaluators.
#
# CAPN3 was the only gene populated through Milestone 3. DMD was added in
# Milestone 4 specifically for X-linked hemizygous interpretation (see
# clinical.py). Note: DMD pathogenic variants are very often multi-exon
# deletions/duplications (structural, copy-number variants), which
# VariantEvidenceBundle/TranscriptConsequence (and therefore this file's
# GeneDiseaseContext, which every VariantEvidenceBundle references) still
# do not represent -- CNV deletions and duplications are modeled
# separately, as of batches 23/24, via CnvDeletionEvidence/
# CnvDuplicationEvidence + cnv_scoring.py (config/dosage_sensitivity.yaml,
# not this file, holds their gene-level input). The DMD point-mutation
# fixtures in variant_evidence.json remain real/synthetic point/small-indel
# variants for exactly this reason -- see README.md, "DMD CNV/structural-
# variant scoring (batch 23)" for the full writeup of the separate CNV
# evidence family and why it isn't folded into this schema.

# CAPN3's specification was upgraded from GENERIC_ACMG to VCEP during the
# batch-4 curated-set expansion, once the real ClinGen LGMD VCEP CAPN3
# specification (v2.0, 2025-07-09) was found. Only PM2/BA1/BS1 thresholds
# and PM2's strength were actually adopted into this prototype's
# evaluators (see config/population_thresholds.yaml) -- the VCEP's other
# criteria (PS1, PS3, PM1, PM3, PM4, PM5, PP1, PP4, BS2, BS4, BP2) and its
# Bayesian point-based combining system are not implemented here. DMD has
# no VCEP specification adopted and remains GENERIC_ACMG.

# BRCA1 was added in batch 31, this project's first autosomal dominant gene
# and the first proof that the framework generalizes beyond the AR (CAPN3)
# and X-linked (DMD) patterns it was built against. Real ClinGen ENIGMA
# BRCA1/BRCA2 VCEP specification adopted (see specification.version below
# and config/population_thresholds.yaml's threshold_source for exactly what
# was and wasn't carried over). Scope this batch is point-mutation criteria
# only, single monoallelic variant case-level reasoning only -- CNV/dosage,
# BRCA2, PM3/BS2 (Fanconi-anemia-phenotype evidence), and two-variant AD
# case reasoning are all explicitly deferred. See README.md, "BRCA1
# extension (Batch 31)" for the full writeup, including why a single
# monoallelic pathogenic variant here resolves case-level status to the new
# CaseInterpretationStatus.RISK_CONFERRING rather than EXPLAINED.

genes:
  CAPN3:
    gene: CAPN3
    disease: "Limb-girdle muscular dystrophy, type R1 calpain3-related (LGMDR1 / calpainopathy)"
    inheritance: AUTOSOMAL_RECESSIVE
    mechanism: LOSS_OF_FUNCTION
    lof_established: true
    specification:
      type: VCEP
      version: "ClinGen LGMD VCEP Specifications to the ACMG/AMP Guidelines for CAPN3, v2.0 (2025-07-09; DOI 10.5281/zenodo.21434844)"
    gene_disease_validity: "ClinGen: Definitive (CAPN3-LGMDR1, autosomal recessive)"

  DMD:
    gene: DMD
    disease: "Duchenne/Becker muscular dystrophy (dystrophinopathy)"
    inheritance: X_LINKED_RECESSIVE
    mechanism: LOSS_OF_FUNCTION
    lof_established: true
    specification:
      type: GENERIC_ACMG
      version: "Richards et al. 2015"
    gene_disease_validity: "ClinGen: Definitive (DMD-dystrophinopathy, X-linked)"

  BRCA1:
    gene: BRCA1
    disease: "Hereditary breast and ovarian cancer syndrome (BRCA1-related)"
    inheritance: AUTOSOMAL_DOMINANT
    mechanism: LOSS_OF_FUNCTION
    lof_established: true
    specification:
      type: VCEP
      version: "ClinGen ENIGMA BRCA1 and BRCA2 VCEP Specifications to the ACMG/AMP Guidelines for BRCA1, v1.2 (2025-01-09; DOI 10.5281/zenodo.21434315)"
    gene_disease_validity: "ClinGen: Definitive (BRCA1-hereditary breast and ovarian cancer, autosomal dominant) -- per Lee et al. 2019, Genetics in Medicine 21:1497-1506 (ClinGen clinical validity framework applied to 31 HBOC panel genes; BRCA1 confirmed Definitive for both breast and ovarian cancer in that assessment)"
